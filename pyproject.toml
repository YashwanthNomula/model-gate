[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "model-gate"
version = "1.0.0"
description = "CI deployment gate: validate a model artifact before promotion to production"
authors = [{name = "Yashwanth Nomula"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
mgate = "modelgate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["modelgate*"]
